{% extends "base.html" %}

{% block title %}Connexion — Lunéa Atelier{% endblock %}

{% block content %}

<section class="auth-page">
    <div class="auth-box">
        <span>Espace client</span>
        <h1>Connexion</h1>
        <p>Connectez-vous pour retrouver vos commandes et vos bracelets favoris.</p>

        {% if erreur %}
            <div class="auth-error">{{ erreur }}</div>
        {% endif %}

        <form method="POST" action="/connexion">
            <div class="form-group">
                <label for="connexion-email">Adresse email</label>
                <input type="email" id="connexion-email" name="email" placeholder="votre@email.com" required>
            </div>
            <div class="form-group">
                <label for="connexion-password">Mot de passe</label>
                <input type="password" id="connexion-password" name="mot_de_passe" placeholder="••••••••" required>
            </div>
            <button type="submit">Se connecter</button>
        </form>

        <p>Pas encore de compte ? <a href="/inscription">Créer un compte</a></p>
    </div>
</section>

{% endblock %}
