{% extends "base.html" %}

{% block content %}

<section class="auth-page">
    <div class="auth-box">
        <span>Créer un compte</span>
        <h1>Inscription</h1>

        {% if erreur %}
            <p class="auth-error">{{ erreur }}</p>
        {% endif %}

        <form method="POST" action="/inscription">

            <input
                type="text"
                name="nom"
                placeholder="Nom"
                required
            >

            <input
                type="text"
                name="prenom"
                placeholder="Prénom"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Adresse email"
                required
            >

            <input
                type="password"
                name="mot_de_passe"
                placeholder="Mot de passe"
                required
            >

            <button type="submit">
                Créer mon compte
            </button>

        </form>

        <p>
            Déjà inscrit ?
            <a href="/connexion">Se connecter</a>
        </p>

    </div>
</section>

{% endblock %}
