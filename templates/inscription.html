{% extends "base.html" %}

{% block title %}Inscription — Lunéa Atelier{% endblock %}

{% block content %}

<section class="auth-page">
    <div class="auth-box">
        <span>Créer un compte</span>
        <h1>Inscription</h1>
        <p>Créez votre compte pour commander vos bracelets personnalisés.</p>

        {% if erreur %}
            <div class="auth-error">{{ erreur }}</div>
        {% endif %}

        <form method="POST" action="/inscription">
            <div class="form-group">
                <label for="inscription-nom">Nom</label>
                <input type="text" id="inscription-nom" name="nom" placeholder="Ex : Mrabet" required>
            </div>
            <div class="form-group">
                <label for="inscription-prenom">Prénom</label>
                <input type="text" id="inscription-prenom" name="prenom" placeholder="Ex : Amine" required>
            </div>
            <div class="form-group">
                <label for="inscription-email">Adresse email</label>
                <input type="email" id="inscription-email" name="email" placeholder="votre@email.com" required>
            </div>
            <div class="form-group">
                <label for="inscription-password">Mot de passe</label>
                <input type="password" id="inscription-password" name="mot_de_passe" placeholder="••••••••" required>
            </div>

            <button type="submit">Créer mon compte</button>
        </form>

        <p>Déjà un compte ? <a href="/connexion">Se connecter</a></p>
    </div>
</section>

{% endblock %}
