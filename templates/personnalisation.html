{% extends "base.html" %}

{% block content %}

<section class="custom-page">

    <div class="custom-intro">
        <span>Création sur mesure</span>
        <h1>Personnalise ton bracelet</h1>
        <p>Choisis les couleurs, la taille, le prénom et le style de ton bracelet.</p>
    </div>

    <div class="custom-container">

        <div class="custom-preview">
            <h2>Aperçu du bracelet</h2>

            <div class="bracelet-demo">
                <span></span>
                <span></span>
                <span></span>
                <strong>A</strong>
                <span></span>
                <span></span>
                <span></span>
            </div>

            <p class="preview-text">
                Exemple visuel de bracelet personnalisé avec perles et lettre.
            </p>
        </div>

        <form class="custom-form">

            <label>Prénom ou texte</label>
            <input type="text" placeholder="Ex : Lina">

            <label>Couleur principale</label>
            <select>
                <option>Rose poudré</option>
                <option>Blanc nacré</option>
                <option>Doré</option>
                <option>Bleu ciel</option>
                <option>Noir élégant</option>
            </select>

            <label>Taille du bracelet</label>
            <select>
                <option>Enfant</option>
                <option>Adolescent</option>
                <option>Adulte</option>
            </select>

            <label>Type de perles</label>
            <select>
                <option>Petites perles</option>
                <option>Perles moyennes</option>
                <option>Perles nacrées</option>
                <option>Perles dorées</option>
            </select>

            <label>Quantité</label>
            <input type="number" value="1" min="1">

            <div class="price-box">
                <span>Prix estimé</span>
                <strong>19,99 €</strong>
            </div>

            <button type="submit">Ajouter au panier</button>

        </form>

    </div>

</section>

{% endblock %}
